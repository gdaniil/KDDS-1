<style>
  :root {
    --phone-w: 375px;
    /* from Figma, not a system token: the read-only licence plate (Figma 4067:7550). The strip and flag colours are the same literals LicensePlate.jsx uses; the number is SF Mono, outside the type scale. */
    --plate-ua-blue: #2170cf;
    --plate-flag-blue: #21a7e9;
    --plate-flag-yellow: #feee24;
    --plate-num-size: 22px;
    --plate-region-size: 10px;

  /* Page chrome around the phones (English). Everything inside .phone is system components plus the custom pieces below, all on tokens. */
  body { margin: 0; background: var(--background-bg-surface); color: var(--content-content-primary); font-family: var(--font-sf); }
  .page { box-sizing: border-box; max-width: calc(var(--phone-w) * 3 + var(--space-5) * 4 + var(--space-5) * 2); margin: 0 auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
  .page h1, .page h2, .page p { margin: 0; }
  .intro { display: flex; flex-direction: column; gap: var(--space-2); }
  .toolbar { display: flex; align-items: center; gap: var(--space-3); }
  .toolbar .switch { width: 220px; }
  .panel { box-sizing: border-box; padding: var(--space-5); border-radius: var(--radius-card); background: var(--background-bg-subtle); overflow-x: auto; }
  .phones { display: grid; grid-template-columns: repeat(auto-fit, var(--phone-w)); justify-content: center; align-items: start; gap: var(--space-5); }
  .demo { margin: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .demo figcaption { display: flex; flex-direction: column; gap: var(--space-1); min-height: calc(var(--space-6) * 3 + var(--space-2)); }
  /* From 481px up the phones always fit, so the panel clips instead of scrolling: a scroll container would stop the Toast sticking to the viewport. */
  @media (min-width: 481px) { .panel { overflow-x: clip; } }
  @media (max-width: 480px) {
    .page { padding: 0; }
    .intro, .toolbar { padding: 0 var(--space-4); }
    .panel { padding: var(--space-4) 0; border-radius: 0; }
    .demo figcaption { padding: 0 var(--space-4); }
  }

  /* The phone: a plain 375-wide frame. data-theme on it switches every token inside. The navbar draws the status bar; there is no tab bar (the system has none). */
  .phone { position: relative; box-sizing: border-box; width: var(--phone-w); overflow: clip; /* square corners, no border or outline: the frame is a plain rectangle */ background: var(--background-bg-background); color: var(--content-content-primary); font-family: var(--font-sf); }
  .phone :is(h2, h3, p, dl, dd, ol, ul) { margin: 0; padding: 0; }
  .phone :is(ol, ul) { list-style: none; }
  .screen { display: flex; flex-direction: column; height: 100%; }
  /* A frame that is not clipped in Figma keeps at least the Figma height and grows to its content, so nothing is hidden. */
  .phone.fit { height: auto; display: flex; flex-direction: column; }
  .phone.fit .screen { flex: 1 1 auto; height: auto; }
  .top { flex: none; }
  .scroll { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  /* The Toast sits 16px above the bottom of the frame, and sticks to the bottom of the viewport while a tall frame is partly off screen. */
  .slot-bottom { position: sticky; bottom: 0; z-index: 3; height: 0; margin: 0 var(--space-4); pointer-events: none; }
  .slot-bottom > * { transform: translateY(calc(-100% - var(--space-4))); }

  /* Layout helpers shared by the six pages. */
  .body4 { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-1) 0 var(--space-5); }
  .body16 { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5) var(--space-4); }
  .stack1 { display: flex; flex-direction: column; gap: var(--space-1); }
  .stack2 { display: flex; flex-direction: column; gap: var(--space-2); }
  .stack3 { display: flex; flex-direction: column; gap: var(--space-3); }
  .stack4 { display: flex; flex-direction: column; gap: var(--space-4); }
  .center { align-items: center; text-align: center; }
  .secondary { color: var(--content-content-secondary); }
  .accent { color: var(--content-content-accent); }
  .link { color: var(--content-content-link); }
  .reset { appearance: none; background: none; border: 0; padding: 0; margin: 0; font-family: inherit; color: inherit; text-align: left; cursor: pointer; }
  .reset:focus-visible, .tappable:focus-visible { outline: 2px solid var(--border-border-accent); outline-offset: 2px; }
  /* A 24px row or icon that must be tapped: the tap area grows to 44-48px without moving anything. */
  .hit { position: relative; }
  .hit::after { content: ""; position: absolute; top: calc(var(--space-3) * -1); right: calc(var(--space-1) * -1); bottom: calc(var(--space-3) * -1); left: calc(var(--space-1) * -1); }
  .hit-sm::after { top: calc(var(--space-1) * -1); bottom: calc(var(--space-1) * -1); left: 0; right: 0; }

  /* Sections are the system Card (padding="large"). */
  .tappable { cursor: pointer; }
  .tappable:active { opacity: 0.7; }
  .hair { flex: none; height: 1px; background: var(--border-border-regular); }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex: none; }
  .icon-btn::after { content: ""; position: absolute; top: calc(var(--space-3) * -1); right: calc(var(--space-3) * -1); bottom: calc(var(--space-3) * -1); left: calc(var(--space-3) * -1); }

  /* custom: StatusLine */
  .status { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
  .status.end { flex-direction: row-reverse; }
  .dot { flex: none; width: 16px; height: 16px; border-radius: var(--radius-pill); }
  .dot.accent { background: var(--background-bg-accent); }
  .dot.positive { background: var(--background-bg-positive); }
  .dot.warning { background: var(--background-bg-warning); }

  /* custom: TimelineStep */
  .steps { display: flex; flex-direction: column; gap: var(--space-4); }
  .step { display: flex; align-items: flex-start; gap: var(--space-3); }
  .step-mark { flex: none; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; box-sizing: border-box; }
  .step-mark.pending { border: 2px solid var(--border-border-regular); border-radius: var(--radius-pill); }
  .phone[data-theme="dark"] .step-mark.pending { border-color: var(--content-content-disabled); }
  .step-mark.current { color: var(--content-content-accent); }
  .step-mark.done { color: var(--content-content-secondary); }
  .step-txt { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }

  /* custom: DetailField */
  .kv { display: flex; flex-direction: column; gap: var(--space-4); }
  .kv-item { display: flex; align-items: center; gap: var(--space-1); }
  .kv-text { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
  .kv-text dd { white-space: pre-line; overflow-wrap: anywhere; }
  .photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
  .ph { height: 138px; border-radius: var(--radius-control); background: var(--background-bg-subtle); border: 1px solid var(--border-border-regular); box-sizing: border-box; }

  /* custom: VoteBar */
  .votebar { display: flex; gap: var(--space-1); height: 12px; }
  .votebar > span { min-width: 0; border-radius: var(--radius-sm); }
  .votebar .yes { background: var(--background-bg-positive); }
  .votebar .no { background: var(--background-bg-warning); }
  .legend { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }

  /* custom: OutRow, AvatarStack */
  .out-row { display: flex; align-items: center; gap: var(--space-4); width: 100%; min-height: 24px; }
  .out-row .grow { flex: 1 1 0; min-width: 0; }
  .out-trail { display: flex; align-items: center; flex: none; gap: 0; }
  .avatars { display: flex; margin-right: 0; }
  .avatar { display: flex; flex: none; width: 24px; height: 24px; box-sizing: border-box; border: 1px solid var(--background-bg-surface); border-radius: var(--radius-pill); background: var(--background-bg-surface); overflow: hidden; margin-right: calc(var(--space-2) * -1); }
  .avatar:last-child { margin-right: 0; }

  /* custom: ResultCard, TagPill */
  .result-head { display: flex; align-items: center; gap: var(--space-2); }
  .result-head .status { flex: 1 1 0; }
.phone .section-title { box-sizing: border-box; padding: var(--space-5) var(--space-5) var(--space-2); }
  .tags { display: flex; flex-wrap: wrap; gap: var(--space-1); }
  .tag { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--space-2); border-radius: var(--radius-pill); background: var(--background-bg-subtle); color: var(--content-content-primary); white-space: nowrap; }
  .tag.accent { background: var(--background-bg-accent-subtle); color: var(--content-content-accent); }

  /* custom: BookCover (a generated cover: brand yellow and navy stay the same in both themes) */
  .book { display: flex; gap: var(--space-4); }
  .book-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; padding: var(--space-4) 0; }
  .cover { position: relative; box-sizing: border-box; flex: none; width: 140px; height: 215px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: var(--space-3) var(--space-2) var(--space-3) var(--space-4); border-radius: var(--radius-sm); background: var(--vibrant-vibrant-yellow); color: var(--vibrant-vibrant-dark-blue); }
  .cover-txt { display: flex; flex-direction: column; gap: var(--space-1); }
  .cover-author { opacity: 0.4; }
  .spine { position: absolute; top: 0; bottom: 0; background: var(--vibrant-vibrant-dark-blue); opacity: 0.1; }
  .spine.a { left: 0; width: 6px; }
  .spine.b { left: 8px; width: 2px; }

  /* custom: RichRow, TintDisc */
  .rich { display: flex; gap: var(--space-3); width: 100%; align-items: center; }
  .rich.top { align-items: flex-start; }
  .rich-txt { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
  .disc { display: flex; align-items: center; justify-content: center; flex: none; width: 40px; height: 40px; border-radius: var(--radius-pill); }
  .disc.green { background: var(--vibrant-vibrant-green-10); color: var(--content-content-positive); }
  .disc.orange { background: var(--vibrant-vibrant-orange-10); color: var(--content-content-warning); }
  .avatar-lg { display: flex; flex: none; width: 40px; height: 40px; overflow: hidden; border-radius: var(--radius-pill); }
  .actions-row { display: flex; align-items: center; gap: var(--space-2); }
  .actions-row .grow { flex: 1 1 0; min-width: 0; }

  /* custom: LinkRow */
  .link-row { display: flex; align-items: center; gap: var(--space-3); width: 100%; box-sizing: border-box; height: 48px; padding: 0 var(--space-4); color: var(--content-content-link); }
  .link-row span:last-child { flex: 1 1 0; min-width: 0; }

  /* custom: StepRow, SummaryRow, QrPlaceholder */
  .stp { display: flex; align-items: center; gap: var(--space-2); }
  .badge { display: flex; align-items: center; justify-content: center; flex: none; width: 24px; height: 24px; border-radius: var(--radius-pill); color: var(--content-content-primary-invert); background: var(--background-bg-background-invert); }
  .badge.current { background: var(--background-bg-accent); }
  .stp-txt { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
  .summary { box-sizing: border-box; padding: var(--space-2) var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
  .sum-line { display: flex; align-items: center; gap: var(--space-3); }
  .sum-line span:first-child { flex: 1 1 0; min-width: 0; }
  .sum-line span:last-child { flex: none; white-space: nowrap; text-align: right; }
  .sum-link { display: inline-flex; align-items: center; align-self: flex-start; color: var(--content-content-accent); }
  .qr { display: flex; align-items: center; justify-content: center; width: 260px; height: 260px; max-width: 100%; box-sizing: border-box; border-radius: var(--radius-sm); background: var(--background-bg-subtle); border: 1px solid var(--border-border-regular); color: var(--content-content-secondary); }

  /* custom: PolicyStatus, PlateDisplay, FactRow */
  .plate { display: inline-flex; gap: 2px; box-sizing: border-box; height: 32px; padding: 2px; border-radius: 4px; background: var(--background-bg-background-invert); border: 1px solid var(--border-border-regular); }
  .plate-ua { display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-sizing: border-box; padding: var(--space-1); border-radius: 2px; background: var(--plate-ua-blue); color: var(--content-content-primary-invert); }
  .plate-flag { display: flex; flex-direction: column; }
  .plate-flag i { display: block; width: 14px; height: 4px; }
  .plate-flag i:first-child { background: var(--plate-flag-blue); }
  .plate-flag i:last-child { background: var(--plate-flag-yellow); }
  .plate-region { font-family: var(--font-mono); font-size: var(--plate-region-size); font-weight: 700; line-height: 1; }
  .plate-num { display: flex; align-items: center; padding: 0 var(--space-1); border-radius: 2px; background: var(--background-bg-surface); color: var(--content-content-primary); font-family: var(--font-mono); font-size: var(--plate-num-size); font-weight: 500; text-transform: uppercase; white-space: nowrap; }
  .fact { display: flex; align-items: center; gap: var(--space-2); }
  .fact-ic { flex: none; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
  .fact-label { flex: 1 1 0; min-width: 0; }
  .fact-value { flex: 0 1 auto; min-width: 0; text-align: right; }

<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Cell, Icon, NavbarRegular, SegmentedControl, Toast } = window.KyivDigitalDesignSystem_728336;

const noop = () => {};
const { Card } = window.KyivDigitalDesignSystem_728336; // the system surface block

// A Toast is shown for a moment: keep it in state, clear it with a timer, and place it at the bottom of the screen.
function useToast() {
  const [toast, setToast] = React.useState(null);
  const timer = React.useRef(0);
  const show = (label, type = 'success') => {
    clearTimeout(timer.current);
    setToast({ label, type });
    timer.current = setTimeout(() => setToast(null), 2500);
  };
  React.useEffect(() => () => clearTimeout(timer.current), []);
  const node = (
    <div className="slot-bottom" aria-live="polite">
      {toast && <Toast type={toast.type} label={toast.label} />}
    </div>
  );
  return [node, show];
}

function copyText(text) {
  try {
    if (navigator.clipboard) navigator.clipboard.writeText(text).catch(noop);
  } catch (e) { /* clipboard is optional: the Toast still confirms the tap */ }
}

/* ---------- custom pieces: small, named, free in shape, strict in tokens ---------- */

/* Section — a full-width section of a detail page, 4px apart — Figma 4067:5635. It is the system Card (padding="large", radius-control,
   shadow-elevation); this wrapper only carries the frames' one-off paddings (`pad`) and gaps as CSS values. */
function Section({ pad, gap, as = 'section', children, ...rest }) {
  return <Card as={as} padding="large" style={pad ? { padding: pad, gap } : { gap }} {...rest}>{children}</Card>;
}

/* custom: Hairline — 1px divider, border-regular — Figma 4067:6134 (351px line inside a 24px-padded block) */
function Hairline({ inset = 0 }) {
  return <div className="hair" role="separator" style={{ margin: '0 ' + inset }} />;
}

/* The detail navbar is NavbarRegular transparent (no fill, no divider, no title) with onBack and this share action — Figma 4067:5630 */
const SHARE = { icon: 'Ic2ShareIos', label: 'Поділитися', onClick: noop };

/* custom: StatusLine — 16px status dot plus the status in words, never colour alone — Figma 4067:5637 */
function StatusLine({ tone = 'accent', label, end = false, className = '' }) {
  return (
    <div className={'status ' + (end ? 'end ' : '') + className}>
      <span className={'dot ' + tone} aria-hidden="true" />
      <span className="footnote">{label}</span>
    </div>
  );
}

/* custom: TimelineStep — 24px marker (done / current / pending), date, then the event — Figma 4067:5643 */
const MARK = {
  done: { icon: 'Ic2CheckFilled', text: 'Виконано' },
  current: { icon: 'Ic2ArrowRightFilled', text: 'Поточний етап' },
  pending: { icon: null, text: 'Очікується' },
};
function TimelineStep({ state, date, text }) {
  const m = MARK[state];
  return (
    <li className="step">
      <span className={'step-mark ' + state} role="img" aria-label={m.text}>{m.icon && <Icon name={m.icon} size={24} />}</span>
      <div className="step-txt">
        <span className="footnote secondary">{date}</span>
        <span className="subheadline">{text}</span>
      </div>
    </li>
  );
}

/* custom: DetailField — label stacked over its value, optional trailing action; several values for a list like opening hours — Figma 4067:5670 */
function DetailField({ label, values, action }) {
  const list = Array.isArray(values) ? values : [values];
  return (
    <div className="kv-item">
      <dl className="kv-text">
        <dt className="footnote secondary">{label}</dt>
        {list.map((v) => <dd key={v} className="subheadline-emphasized">{v}</dd>)}
      </dl>
      {action}
    </div>
  );
}

/* custom: PhotoTile — placeholder: report photos are raster assets that are not available here — Figma 4067:5693 */
function PhotoTile({ n }) {
  return <div className="ph" role="img" aria-label={'Фото звернення ' + n} />;
}

/* custom: VoteBar — two proportional segments, radius-sm, 4px apart; the counts below say the same in words — Figma 4067:6123 */
function VoteBar({ yes, no }) {
  return (
    <div className="votebar" role="img" aria-label={'Прийнято ' + yes + ', не прийнято ' + no}>
      <span className="yes" style={{ flexGrow: yes }} />
      <span className="no" style={{ flexGrow: no }} />
    </div>
  );
}

/* custom: AvatarStack — three 24px avatars overlapping by 8px, ringed in the surface colour; placeholder: deputy photos are raster assets — Figma 4067:6137 */
function AvatarStack() {
  return (
    <span className="avatars" aria-hidden="true">
      {[0, 1, 2].map((i) => <span className="avatar" key={i}><Icon name="Ic2ProfileEmpty" size={24} /></span>)}
    </span>
  );
}

/* custom: OutRow — one line label with a trailing glyph (chevron, avatars, external-link), tap area 48px tall — Figma 4067:6135 */
function OutRow({ label, trailing }) {
  return (
    <button type="button" className="reset hit out-row" onClick={noop}>
      <span className="subheadline-emphasized grow">{label}</span>
      <span className="out-trail">{trailing}</span>
    </button>
  );
}

/* custom: TagPill — 11px chip, `accent` for the reference number, neutral for the date — Figma 4067:6164 */
function TagPill({ tone, children }) {
  return <span className={'tag caption2-emphasized ' + (tone || '')}>{children}</span>;
}

/* custom: ResultCard — a whole card that opens one vote: result, title, tags; Card onClick makes it one real button — Figma 4067:6156 */
function ResultCard({ tone = 'positive', status, title, titleClass = 'callout-emphasized', tags, chevron = true }) {
  return (
    <Card padding="large" gap={4} onClick={noop}>
      <div className="result-head">
        <StatusLine tone={tone} label={status} className="grow" />
        {chevron && <span style={{ marginLeft: 'auto', display: 'flex' }}><Icon name="Ic2Chevron" size={24} /></span>}
      </div>
      <p className={titleClass}>{title}</p>
      {tags && <div className="tags">{tags}</div>}
    </Card>
  );
}

/* custom: BookCover — the generated cover shown when the library has no scan: brand yellow, Ic2Kd, title and author, two spine strips — Figma 4067:6268 */
function BookCover({ title, author }) {
  return (
    <div className="cover" role="img" aria-label={'Обкладинка: ' + title + ', ' + author}>
      <Icon name="Ic2Kd" size={16} />
      <div className="cover-txt">
        <span className="caption1-emphasized">{title}</span>
        <span className="caption2 cover-author">{author}</span>
      </div>
      <i className="spine a" /><i className="spine b" />
    </div>
  );
}

/* custom: TintDisc — 40px disc tinted green or orange with a 20px glyph — Figma 4067:6283 */
function TintDisc({ tone, icon }) {
  return <span className={'disc ' + tone} aria-hidden="true"><Icon name={icon} size={20} /></span>;
}

/* custom: RichRow — 40px lead (avatar or TintDisc), overline, title, optional body and chevron — Figma 4067:6275 */
function RichRow({ lead, overline, title, body, chevron, onClick }) {
  const inner = (
    <>
      {lead}
      <span className="rich-txt">
        {overline && <span className="footnote secondary">{overline}</span>}
        <span className="subheadline-emphasized">{title}</span>
        {body && <span className="footnote">{body}</span>}
      </span>
      {chevron && <Icon name="Ic2Chevron" size={24} />}
    </>
  );
  return onClick
    ? <button type="button" className="reset hit hit-sm rich" onClick={onClick}>{inner}</button>
    : <div className={'rich ' + (body ? 'top' : '')}>{inner}</div>;
}

/* Button size="small" is 32px tall and keeps no larger tap area (the README says it does): pad the button box by 8px and pull it back with the same negative margin, so the hit area is 48px tall and the layout stays as drawn. */
function SmallButton(props) {
  return <Button size="small" {...props} style={{ padding: 'var(--space-2) 0', margin: 'calc(var(--space-2) * -1) 0' }} />;
}

/* custom: LinkRow — 48px row, 24px glyph and label in content-link; `Cell` has no link tone yet — Figma 4067:6321 */
function LinkRow({ icon, label, onClick = noop, inset = 'var(--space-4)' }) {
  return (
    <button type="button" className="reset link-row subheadline-emphasized" style={{ paddingLeft: inset, paddingRight: inset }} onClick={onClick}>
      <Icon name={icon} size={24} />
      <span>{label}</span>
    </button>

/* custom: StepRow — 24px badge, title, time or description; `current` is the accent step — Figma 4067:6790 */
function StepRow({ state, title, text }) {
  const current = state === 'current';
  return (
    <li className="stp">
      <span className={'badge ' + state} role="img" aria-label={current ? 'Поточний крок' : 'Виконано'}><Icon name="Ic2Check" size={16} /></span>
      <div className="stp-txt">
        <span className={'subheadline-emphasized ' + (current ? 'accent' : '')}>{title}</span>
        <span className="caption1-emphasized">{text}</span>
      </div>
    </li>
  );
}

/* custom: SummaryRow — label and amount on one line, a small link under it — Figma 4067:6808 */
function SummaryRow({ label, amount, linkLabel }) {
  return (
    <div className="summary">
      <div className="sum-line subheadline-emphasized"><span>{label}</span><span>{amount}</span></div>
      <button type="button" className="reset hit sum-link footnote-emphasized" onClick={noop}>

}

/* custom: QrPlaceholder — placeholder: the QR code is a generated image, not available here — Figma 4067:6787 */
function QrPlaceholder() {
  return <div className="qr" role="img" aria-label="QR-код для штрафмайданчика"><Icon name="Ic2Qr" size={48} /></div>;
}

/* custom: PlateDisplay — read-only 32px licence plate; LicensePlate is a 48px input, so it cannot show a plate — Figma 4067:7550 */
function PlateDisplay({ value }) {
  return (
    <div className="plate" role="img" aria-label={'Номер авто ' + value}>

/* custom: FactRow — optional 20px glyph, primary label, right-aligned value; CellDataRow has no glyph and a quiet label — Figma 4067:7560 */
function FactRow({ icon, label, value }) {
  return (
    <div className="fact">

      <span className="subheadline fact-label">{label}</span>

/* A Cell with a caption and a leading glyph in the link colour: the contact rows of the library and policy pages. */

}
