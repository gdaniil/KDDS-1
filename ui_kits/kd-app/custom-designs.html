const DAYS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];
const SLOT_WORD = { on: 'є світло', off: 'немає світла', possible: 'можливе відключення' };
// Sample data. Monday is the Figma sample; the other days are the same pattern shifted, so the control visibly changes the chart.
const MONDAY = ['on', 'on', 'off', 'off', 'off', 'off', 'possible', 'possible', 'on', 'on', 'on', 'on', 'off', 'off', 'off', 'off', 'possible', 'possible', 'on', 'on', 'on', 'on', 'off', 'off'];
const slotsFor = (dayIndex) => MONDAY.map((_, hour) => MONDAY[(hour + dayIndex * 3) % 24]);

/* custom: TimeSlot — Figma 4067:4663 (one hour of the outage chart; state = on / off / possible, never colour alone) */
function TimeSlot({ hour, state }) {
  const label = String(hour).padStart(2, '0') + ':00';
  return (
    <div className={'slot tone-power-' + state} role="img" aria-label={label + ', ' + SLOT_WORD[state]}>
      {state !== 'possible' && <LightGlyph on={state === 'on'} />}
      <span className="footnote">{label}</span>
    </div>
  );
}

/* custom: ActionRow — Figma 4067:4699 (a Cell whose label is a link or a destructive action; Cell has no tone prop) */
function ActionRow({ icon, label, tone, onClick }) {
  return (
    <button type="button" className={'action-row action-' + tone} onClick={onClick}>
      <Icon name={icon} size={24} />
      <span className="subheadline-emphasized">{label}</span>
    </button>
  );
}

/* custom: GlassCard — Figma 4067:7395 (floating Liquid Glass card over a map: grabber, header row, key-value rows, primary action) */

  { id: 'faq', label: 'Часті питання' },
];

];

/* The Home screen behind the overlay, built from the system's own Home parts. It is blurred and hidden from assistive tech; the feed text is sample copy, unreadable under the blur. */
function HomeBehind() {
  return (
    <div className="home-behind" aria-hidden="true" inert="">
      <NavbarMain type="home" scrolled={false} date="23 жовтня" greeting="Доброго дня!" temperature="23°" weatherIcon="Ic2Sun" aqi={47} />
      <div className="home-row">

/* custom: OverlayChip — Figma 4067:8268 (filter chip on the dark overlay; selected = white, others = translucent) */
function OverlayChip({ label, on, onClick }) {
  return <button type="button" className={'ov-chip tap' + (on ? ' is-on' : '')} aria-pressed={on} onClick={onClick}><span className="caption1-emphasized">{label}</span></button>;
}

/* custom: OverlayRow — Figma 4067:8274, 4067:8279 and 4067:8291 (row on the dark overlay: bare icon or 48px tile, label, optional chevron) */
function OverlayRow({ icon, tile, label, chevron }) {
  const glyph = icon && <Icon name={icon} size={24} />;
  return (
    <button type="button" className="ov-row" onClick={noop}>
      {glyph && (tile ? <span className="ov-tile">{glyph}</span> : glyph)}
      <span className="subheadline-emphasized ov-label">{label}</span>
      {chevron && <Icon className="ov-chevron" name="Ic2Chevron" size={20} />}
    </button>
  );
}

function SearchScreen() {
  const [query, setQuery] = useState('Проїзний');
  const [chip, setChip] = useState('all');
  const shows = (id) => chip === 'all' || chip === id;
  return (
    <div className="screen">
      <HomeBehind />
      {/* The glass: backdrop blur plus a dark tint, both declared at the top of the page (--overlay-blur, --overlay-tint per theme). */}
      <div className="overlay" aria-hidden="true" />
      <StatusOverMap inverted />
      <div className="over-content">
        <Search value={query} onChange={setQuery} onClear={() => setQuery('')} onCancel={() => setQuery('')} />
        <div className="ov-chips" role="group" aria-label="Розділи пошуку">
          {OVERLAY_CHIPS.map((c) => <OverlayChip key={c.id} label={c.label} on={chip === c.id} onClick={() => setChip(c.id)} />)}
        </div>
        <div className="scroll">
          {shows('useful') && (
            <section className="ov-section">
              <h2 className="footnote ov-caption">Корисне</h2>
              <OverlayRow icon="Ic2Sparkles" label="Придбати проїзний" />
              <OverlayRow icon="Ic2Sparkles" label="Придбати цифрову карту" />
              <OverlayRow icon="Ic2ExternalLink" label="Мапа продажу проїзних" />
            </section>
          )}
          {shows('services') && (
            <section className="ov-section ov-services">
              <h2 className="footnote ov-caption">Сервіси</h2>
              <OverlayRow icon="Ic2Tk" tile label="Транспортна карта" chevron />
              <OverlayRow icon="Ic2Qr" tile label="QR-квитки" chevron />
            </section>
          )}
          {shows('faq') && (
            <section className="ov-section">
              <h2 className="footnote ov-caption">Часті питання</h2>
              {FAQ.map((q) => <OverlayRow key={q} label={q} chevron />)}
            </section>
          )}
        </div>
      </div>
    </div>
  );
}

    warn: 'Chips filter the sections. Home is blurred, so its copy is not read.' },
];
const COLUMNS = [['power', 'search'], ['library', 'rules'], ['radiation', 'parking']];

function Demo({ frame, theme }) {
  const { Screen } = frame;
  return (
    <figure className="demo">
      <figcaption>
        <span className="footnote-emphasized">{frame.name} <span className="muted">· {frame.id}</span></span>
        <span className="footnote">{frame.note}</span>
        <span className="footnote muted">{frame.warn}</span>
      </figcaption>
      <div className="phone" data-theme={theme} style={{ height: frame.height }}><Screen /></div>
    </figure>
  );
}

function Rules() {
  return (
    <aside className="rules" aria-labelledby="rules-title">
      <h2 id="rules-title" className="title3-emphasized">Free shape, fixed ground</h2>
      <p className="subheadline-emphasized">Stays system</p>
      <ul className="footnote">
        <li>Colour roles, <code>space-*</code>, <code>radius-*</code>, type classes: no hex, no px type.</li>
        <li>Light and dark from the first frame; tap targets of 44px or more.</li>
        <li>Ukrainian copy per copywriting.md; status told in words or icon, not by colour alone.</li>
        <li>ic2 icons only; an empty slot where a glyph is missing.</li>
      </ul>
      <p className="subheadline-emphasized">Is free</p>
      <ul className="footnote">
        <li>Layout, density and scroll direction: shelves, grids, full-bleed maps.</li>
        <li>Shape: sheet radii, pills, pins, glass, translucent scrims.</li>
        <li>Where colour sits: covers, pills, charts, overlays.</li>
        <li>Imagery: maps, covers and photos come from the mini-app.</li>
      </ul>
      <p className="subheadline-emphasized">For a new mini-app</p>
      <ul className="footnote">
        <li>Use a public component when one fits; when a prop is missing, write a small named function instead of overriding internals.</li>
        <li>A one-off value gets one local variable with a comment, never a literal in a rule.</li>
        <li>Reserve 54px for the status bar; there is no tab bar yet.</li>
      </ul>
    </aside>
  );
}

function Page() {
  const [themeIndex, setThemeIndex] = useState(0);
  const theme = ['light', 'dark'][themeIndex];
  const byKey = Object.fromEntries(FRAMES.map((f) => [f.key, f]));
  return (
    <main className="page">
      <header className="intro">
        <h1 className="title1-emphasized">Custom designs</h1>
        <p className="callout">Mini-apps inside Kyiv Digital: where screens leave the standard layouts.</p>
        <p className="subheadline muted">Five shipping screens that no standard layout covers. Each is rebuilt from tokens and type classes, with a public component wherever one fits; the rest are small named functions marked <code>custom</code>. Flip the theme: every frame works in both.</p>
        <div className="switch-row">
          <span className="footnote-emphasized">Theme</span>
          <div className="seg"><SegmentedControl options={['Світла', 'Темна']} value={themeIndex} onChange={setThemeIndex} /></div>
        </div>
      </header>
      <div className="board">
        {COLUMNS.map((col, i) => (
          <div className="board-col" key={i}>
            {col.map((key) => (key === 'rules' ? <Rules key={key} /> : <Demo key={key} frame={byKey[key]} theme={theme} />))}
          </div>
        ))}
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
