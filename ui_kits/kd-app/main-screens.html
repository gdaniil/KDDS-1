<script type="text/babel">
const {

const noop = () => {};

/* ---------- Sample data. Copy is from the Figma frames; the invented parts are named in comments. ---------- */

// Home feed. Figma draws a placeholder glyph in every disc; here each entry gets the set icon that matches it.
// The group «7 жовтня» is not in the frame: repeated entries so the screen is long enough to scroll and collapse the bar.
const OUTAGE = { icon: 'Ic2Utilities', title: 'Відключення гарячої води', description: 'У Шевченківському районі строком на 14 днів', wrap: true };

const FEED = [
  { day: 'Сьогодні', items: [
    { icon: 'Ic2FlagUa', title: 'З Днем Незалежності!', description: 'Привітання Володимира Кличка' },
    OUTAGE,
    TICKET,
  ] },
  { day: '10 жовтня', items: [TICKET, OUTAGE] },
  { day: '7 жовтня', items: [OUTAGE, TICKET, TICKET] },
];

const includes = (text, query) => text.toLowerCase().includes(query.trim().toLowerCase());

/* ---------- Custom pieces: free in shape, disciplined in tokens. ---------- */

/* custom: CollapsingTab — Figma 4062:2418 (collapsed bar over scrolling content).
   The expanded NavbarMain lives inside the scroll area (mark it with data-expanded-bar) and scrolls away with the content.
   The collapsed one (`collapsedBar`) floats on top and appears once the expanded bar has scrolled out:
   scrollTop >= expandedHeight - collapsedHeight, so the swap happens exactly under the collapsed bar. */
function CollapsingTab({ collapsedBar, backdrop, initialScroll = 0, children }) {
  const scrollRef = React.useRef(null);
  const barRef = React.useRef(null);
  const [shown, setShown] = React.useState(false);
  const update = React.useCallback(() => {
    const scroll = scrollRef.current;
    const expanded = scroll && scroll.querySelector('[data-expanded-bar]');
    if (!scroll || !expanded || !barRef.current) return;
    setShown(scroll.scrollTop >= expanded.offsetHeight - barRef.current.offsetHeight);
  }, []);
  React.useLayoutEffect(() => {
    if (initialScroll) scrollRef.current.scrollTop = initialScroll;
    update();
  }, []);
  return (
    <div className="tab">
      <div className="bar" ref={barRef} data-shown={shown ? 'true' : 'false'} aria-hidden={shown ? undefined : true}>{collapsedBar}</div>
      <div className="scroll" ref={scrollRef} onScroll={update}>
        <div className={'scroll-body ' + (backdrop || '')}>{children}</div>
      </div>
    </div>
  );
}

/* custom: FeedSheet — Figma 4062:2990 (the rounded feed sheet that rides over the blue Home header) */
function FeedSheet({ children }) {
  return <div className="feed-sheet">{children}</div>;
}

/* custom: FeedCellWrapped — Figma 4062:2994 (FeedCell whose description wraps to two lines, 72px; FeedCell itself truncates to one) */
function FeedCellWrapped({ icon, title, description, onClick }) {
  return (
    <button type="button" className="feed-wrapped" onClick={onClick}>
      <span className="feed-disc"><Icon name={icon} size={24} /></span>
      <span className="feed-text">
        <span className="subheadline-emphasized">{title}</span>
        <span className="footnote feed-desc">{description}</span>
      </span>
      <span className="feed-chevron" aria-hidden="true"><Icon name="Ic2Chevron" size={20} /></span>
    </button>
  );
}

/* custom: ValueCell — Figma 4062:2436 (settings row with a trailing value and the up-down selector; Cell has no such accessory) */
function ValueCell({ icon, label, value, onClick }) {
  return (
    <button type="button" className="value-cell" onClick={onClick} aria-label={label + ': ' + value}>
      <Icon name={icon} size={24} />
      <span className="label subheadline-emphasized">{label}</span>
      <span className="value footnote">{value}</span>
      <span className="selector" aria-hidden="true"><Icon name="Ic2Selector" size={20} /></span>
    </button>
  );
}

/* custom: RightsFooter — Figma 4062:2404 (owner strip at the end of Profile: crest, department name, partner logo) */
function RightsFooter() {
  return (
    <div className="rights">
      <div className="rights-org">
        {/* crest of the city: a raster asset in Figma, not available here */}
        <div className="placeholder-img crest" role="img" aria-label="Герб міста (зображення)" />
        <p className="rights-text">Департамент інформаційно-комунікаційних технологій ВО КМР (КМДА)</p>
      </div>
      {/* partner logo (ГІОЦ): a vector asset in Figma, not available here */}
      <div className="placeholder-img partner-logo" role="img" aria-label="Логотип партнера (зображення)" />
    </div>
  );
}

/* custom: Section — Figma 4062:2385 (services-group in the grid view: ListCaption, 8px, then the tile grid; each tile is its own surface).
   A captioned list block is the system Card with `caption` (Figma 4062:2377 / 4062:2385), not this. */
function Section({ title, children }) {
  return (
    <section className="section">
      <ListCaption label={title} />
      {children}
    </section>
  );
}

/* ---------- Screens ---------- */

function QuickRow() {
  return (
    <div className="quick">
      <QuickAccessItem type="all" label="Міські сервіси" onClick={noop} />
      <QuickAccessItem type="qr-active" label="QR-квитки" status="(5 шт.)" onClick={noop} />
      <QuickAccessItem label="Евакуація" icon="Ic2Evacuation" onClick={noop} />
      <QuickAccessItem label="Погодинне паркування" icon="Ic2HourlyPark" onClick={noop} />
    </div>
  );
}

function FeedGroups() {
  return FEED.map((group) => (
    <div key={group.day}>
      <FeedDate label={group.day} />
      <div className="feed-cells">
        {group.items.map((item, i) => (
          item.wrap
            ? <FeedCellWrapped key={i} icon={item.icon} title={item.title} description={item.description} onClick={noop} />
            : <FeedCell key={i} icon={item.icon} title={item.title} description={item.description} onClick={noop} />
        ))}
      </div>
    </div>
  ));
}

/* Home: blue header with the quick-access row, then the feed sheet. Tap «Пошук» for the search state. */
function HomeScreen() {
  const [searching, setSearching] = React.useState(false);
  const [query, setQuery] = React.useState('');
  const found = ALL_SERVICES.filter((s) => includes(s.label, query));
  const closeSearch = () => { setQuery(''); setSearching(false); };
  const weather = { temperature: '23°', weatherIcon: 'Ic2Sun', aqi: 47, avatar: 'sample' };

  if (searching) {
    return (
      <div className="tab">
        <div className="top">
          <NavbarMain type="home" scrolled {...weather} onAvatarClick={noop} onWeatherClick={noop} onAqiClick={noop} onPowerStatusClick={noop} />
          <div className="blue">
            <Search autoFocus value={query} onChange={setQuery} onClear={() => setQuery('')} onCancel={closeSearch} />
          </div>
        </div>
        <div className="scroll">
          <div className="search-results">
            {found.length > 0 ? (
              <Card padding="list">
                {found.map((s) => <Cell key={s.label} label={s.label} icon={<Icon name={s.icon} />} accessory="chevron" onClick={noop} />)}
              </Card>
            ) : (
              <p className="subheadline empty">Нічого не знайдено. Перевірте назву послуги.</p>
            )}
          </div>
        </div>
      </div>
    );
  }
  return (
    <CollapsingTab
      backdrop="backdrop-blue"
      collapsedBar={<NavbarMain type="home" scrolled {...weather} onAvatarClick={noop} onWeatherClick={noop} onAqiClick={noop} onPowerStatusClick={noop} />}
    >
      <div data-expanded-bar>
        <NavbarMain
          type="home" scrolled={false} date="Понеділок, 23 жовтня" greeting="Добрий день!" {...weather}
          onSearch={() => setSearching(true)} onAvatarClick={noop} onWeatherClick={noop} onAqiClick={noop} onPowerStatusClick={noop}
        />
      </div>
      <div className="home-slot" />
      <QuickRow />
      <FeedSheet><FeedGroups /></FeedSheet>
    </CollapsingTab>
  );
}

/* Services: the grid/list toggle lives in both the expanded and the collapsed bar and drives ServiceGridItem tiles or Cell lists. */
function ServicesScreen({ initialView = 'grid' }) {
  const [view, setView] = React.useState(initialView);
  const bar = (scrolled) => <NavbarMain type="services" scrolled={scrolled} view={view} onViewChange={setView} onHomeClick={noop} />;
  // Grid view: a caption over the tiles. List view: one Card with the caption and the rows.
  const renderGroup = (g) => (
    view === 'grid'
      ? <Section key={g.title} title={g.title}><div className="tiles">{g.items.map((s) => <ServiceGridItem key={s.label} label={s.label} icon={s.icon} onClick={noop} />)}</div></Section>
      : <Card key={g.title} caption={g.title} padding="list">{g.items.map((s) => <Cell key={s.label} label={s.label} icon={<Icon name={s.icon} />} accessory="chevron" onClick={noop} />)}</Card>
  );
  return (
    <CollapsingTab collapsedBar={bar(true)}>
      <div data-expanded-bar>{bar(false)}</div>
      <div className="svc-body">
        {SERVICE_GROUPS.map(renderGroup)}
        <Card caption={USEFUL_LINKS.title} padding="list">
          {USEFUL_LINKS.items.map((s) => <Cell key={s.label} label={s.label} icon={<Icon name={s.icon} />} accessory="chevron" onClick={noop} />)}
        </Card>
      </div>
    </CollapsingTab>
  );
}

/* Profile: header card with avatar, name and phone; grouped Cells under ListCaptions; a lone destructive row; version; rights strip. */

      <div className="profile-body">
        <Card padding="list">
          <Cell label="Адреси" icon={<Icon name="Ic2Address" />} accessory="chevron" onClick={noop} />
          <Cell label="Автомобілі" icon={<Icon name="Ic2Car" />} accessory="chevron" onClick={noop} />
          <Cell label="Картки" icon={<Icon name="Ic2Card" />} accessory="chevron" onClick={noop} />
        </Card>
        <Card padding="list">
          <Cell label="Розповісти друзям" icon={<Icon name="Ic2ShareIos" />} accessory="chevron" onClick={noop} />
        </Card>
        <div className="gap-more">
          <Card caption="Налаштування" padding="list">
              <Cell label="Швидкий доступ" icon={<Icon name="Ic2QuickAsscess" />} accessory="chevron" onClick={noop} />
              <Cell label="Сповіщення" icon={<Icon name="Ic2Notification" />} accessory="chevron" onClick={noop} />
              <Cell label="Безпека" icon={<Icon name="Ic2Security" />} accessory="chevron" onClick={noop} />
              <Cell label="Мапи" icon={<Icon name="Ic2Maps" />} accessory="chevron" onClick={noop} />
              <Cell label="Мова" icon={<Icon name="Ic2Language" />} accessory="segmented" segmentOptions={['Укр', 'En']} segmentValue={lang} onSegmentChange={setLang} />
              {withTheme && (
                <ValueCell icon="Ic2Sun" label="Тема" value={THEME_CHOICES[themeChoice]} onClick={() => setThemeChoice((themeChoice + 1) % THEME_CHOICES.length)} />
              )}
          </Card>
        </div>
        <div className="gap-more">
          <Card caption="Довідка" padding="list">
              <Cell label="Часті питання" icon={<Icon name="Ic2Faq" />} accessory="chevron" onClick={noop} />
              <Cell label="Політика конфіденційності" icon={<Icon name="Ic2Info" />} accessory="chevron" onClick={noop} />
          </Card>
        </div>
        <div className="gap-more">
          <Card padding="list">
            <Cell label={<span className="negative">Вийти</span>} onClick={noop} />
          </Card>
        </div>
        <ListCaption label="Версія 3.0.0" />
      </div>
      <RightsFooter />
    </CollapsingTab>
  );
}

/* ---------- Page ---------- */

function Demo({ name, id, note, theme, height, children }) {
  return (
    <figure className="demo">
      <figcaption>
        <span className="footnote-emphasized">{name} <code className="footnote">{id}</code></span>
        <span className="footnote">{note}</span>
      </figcaption>
      <div className="phone" data-theme={theme} style={{ height }}>{children}</div>
    </figure>
  );
}

// One NavbarMain type in both states, side by side with its height, so the swap rule is readable.
function StateBox({ label, blue, theme, children }) {
  const ref = React.useRef(null);
  const [h, setH] = React.useState(0);
  React.useLayoutEffect(() => { setH(Math.round(ref.current.offsetHeight)); });
  return (
    <div className="state">
      <span className="footnote-emphasized">{label} <span className="footnote muted">{h}px</span></span>
      <div className={'state-box' + (blue ? ' blue' : '')} data-theme={theme} ref={ref}>{children}</div>
    </div>
  );
}

function NavbarStates({ type, theme, props, blue, rule, children }) {
  return (
    <figure className="demo">
      <figcaption>
        <span className="footnote-emphasized">NavbarMain states <code className="footnote">type="{type}"</code></span>
        <span className="footnote">Reference, not a Figma frame. {rule}</span>
      </figcaption>
      <div className="states">
        <StateBox label="scrolled={false}, expanded" blue={blue} theme={theme}><NavbarMain type={type} scrolled={false} {...props} /></StateBox>
        <StateBox label="scrolled, collapsed" theme={theme}><NavbarMain type={type} scrolled {...props} /></StateBox>
      </div>
      <div className="state-note footnote">{children}</div>
    </figure>
  );
}
