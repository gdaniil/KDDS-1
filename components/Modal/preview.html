const { Modal, Button, Icon, NavbarRegular, Cell, CellDataRow, CellSelection, ListCaption } = window.KyivDigitalDesignSystem_728336;

    h(NavbarRegular, { title: "Петиції" }),

      h(ListCaption, { label: "Показано: " + label[shown].toLowerCase() }),

      h("div", { className: "phone" }, h(LiveExample))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
