<style>body{margin:0;padding:16px;background:var(--background-bg-background);color:var(--content-content-primary);font-family:var(--font-sf)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.col{display:flex;flex-direction:column;gap:12px;width:343px}.lbl{font:590 11px/13px var(--font-sf);letter-spacing:-0.4px;color:var(--content-content-primary);width:72px;flex-shrink:0}.grp{width:343px;background:var(--background-bg-surface);border-radius:var(--radius-control);overflow:hidden}.stack{display:flex;flex-direction:column;gap:16px;align-items:flex-start}</style>
<div id="root"></div>
<script>
const h = React.createElement;
const { Button, Icon } = window.KyivDigitalDesignSystem_728336;
function App() {
  const plus = h(Icon, { name: "Ic2Plus" });
  const row = (label, ...items) => h("div", { className: "row" }, h("span", { className: "lbl" }, label), ...items);
  return h("div", null,
    row("regular",
      h(Button, { label: "Оплатити" }),
      h(Button, { variant: "secondary", label: "Скасувати" }),
      h(Button, { variant: "bezeled", label: "Детальніше" }),
      h(Button, { label: "Оплатити", disabled: true })),
    row("with icon",
      h(Button, { label: "Додати авто", icon: plus }),
      h(Button, { variant: "ghost", label: "Додати авто", icon: plus }),
      h(Button, { icon: plus, iconPosition: "only", "aria-label": "Додати" })),
    row("small",
      h(Button, { size: "small", label: "Усі" }),
      h(Button, { size: "small", variant: "secondary", label: "Фільтр", icon: h(Icon, { name: "Ic2Adjust" }) }),
      h(Button, { size: "small", variant: "elevated", label: "Далі", icon: h(Icon, { name: "Ic2Chevron" }), iconPosition: "right" }),
      h(Button, { size: "small", variant: "bezeled", icon: plus, iconPosition: "only", "aria-label": "Додати" })),
    row("loading", h(Button, { label: "Оплачуємо", loading: true })),
    row("full width", h("div", { style: { width: 343 } }, h(Button, { label: "Продовжити", fullWidth: true }))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
