<style>body{margin:0;padding:16px;background:var(--background-bg-background);color:var(--content-content-primary);font-family:var(--font-sf)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.col{display:flex;flex-direction:column;gap:12px;width:343px}.lbl{font:590 11px/13px var(--font-sf);letter-spacing:-0.4px;color:var(--content-content-primary);width:72px;flex-shrink:0}.grp{width:343px;background:var(--background-bg-surface);border-radius:var(--radius-control);overflow:hidden}.stack{display:flex;flex-direction:column;gap:16px;align-items:flex-start}</style>
<div id="root"></div>
<script>
const h = React.createElement;
const { Cell, Icon } = window.KyivDigitalDesignSystem_728336;
function App() {
  const [push, setPush] = React.useState(true);
  const [lang, setLang] = React.useState(0);
  const [opened, setOpened] = React.useState(0);
  return h("div", { className: "grp" },
    h(Cell, { label: opened ? "Мої документи · відкрито " + opened : "Мої документи", icon: h(Icon, { name: "Ic2DocUsed" }), accessory: "chevron", onClick: () => setOpened(opened + 1) }),
    h(Cell, { label: "Push-сповіщення", icon: h(Icon, { name: "Ic2Notification" }), accessory: "switch", checked: push, onCheckedChange: setPush }),
    h(Cell, { label: "Мова", caption: "Українська", icon: h(Icon, { name: "Ic2Language" }), accessory: "chevron", onClick: () => {} }),
    h(Cell, { label: "Мова застосунку", accessory: "segmented", segmentOptions: ["Укр", "En"], segmentValue: lang, onSegmentChange: setLang }),
    h(Cell, { label: "Про застосунок" }));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
